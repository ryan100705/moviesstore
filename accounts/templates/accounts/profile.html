{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
  <h2>Profile Settings</h2>
  <hr>
  <form method="post">
    {% csrf_token %}
    {{ template_data.form.non_field_errors }}
    <div class="mb-3">
      {{ template_data.form.max_content_rating.label_tag }}
      {{ template_data.form.max_content_rating }}
    </div>
    <button type="submit" class="btn btn-dark">Save</button>
  </form>
</div>
{% endblock content %}
